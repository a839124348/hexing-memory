<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鱼的心路历程 · 核星记忆</title>
<style>
  :root{
    --bg:#050814;
    --panel:rgba(13,21,43,.76);
    --line:rgba(110,145,235,.18);
    --line-2:rgba(170,195,255,.24);
    --text:#dbe6ff;
    --muted:#6d80ad;
    --dim:#45557c;
    --blue:#7aa2ff;
    --teal:#6ee7c7;
    --gold:#ffd479;
    --red:#ff8f9b;
    --ease:.25s ease;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%;background:var(--bg)}
  body{
    margin:0;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 560px at 72% -18%, rgba(255,190,90,.10), transparent 62%),
      radial-gradient(900px 500px at 12% -8%, rgba(55,88,190,.22), transparent 60%),
      radial-gradient(700px 500px at 96% 18%, rgba(100,65,170,.14), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(30,100,130,.12), transparent 60%),
      var(--bg);
    min-height:100vh;
    padding:32px clamp(18px,4vw,56px) 56px;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    opacity:.22;mix-blend-mode:soft-light;
    background-image:
      radial-gradient(rgba(255,255,255,.07) .5px, transparent .5px),
      radial-gradient(rgba(0,0,0,.10) .5px, transparent .5px);
    background-size:3px 3px, 4px 4px;
    background-position:0 0, 1px 1px;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(1px 1px at 8% 18%, rgba(180,205,255,.55), transparent),
      radial-gradient(1px 1px at 22% 72%, rgba(150,180,255,.35), transparent),
      radial-gradient(1px 1px at 41% 12%, rgba(255,225,180,.45), transparent),
      radial-gradient(1px 1px at 67% 28%, rgba(170,200,255,.35), transparent),
      radial-gradient(1px 1px at 83% 64%, rgba(190,215,255,.45), transparent),
      radial-gradient(1px 1px at 94% 9%, rgba(255,225,180,.30), transparent),
      radial-gradient(1px 1px at 54% 86%, rgba(170,200,255,.34), transparent);
    background-size:100% 100%;
  }

  .wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto}

  header{
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    margin-bottom:28px;flex-wrap:wrap;
  }
  .eyebrow{font-size:11px;letter-spacing:3.4px;text-transform:uppercase;color:#7185b4;margin:0 0 8px}
  h1{
    margin:0;
    font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
    font-size:clamp(28px,3.4vw,42px);font-weight:400;letter-spacing:.10em;color:#f2f6ff;
    text-shadow:0 0 30px rgba(122,162,255,.14);
  }
  .sub{margin:8px 0 0;font-size:12px;color:var(--muted)}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .btn{
    appearance:none;border:1px solid var(--line);background:rgba(20,31,62,.72);
    color:#b9c9f2;border-radius:999px;padding:9px 15px;font-size:12px;font-family:inherit;
    cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;
    transition:var(--ease);
  }
  .btn:hover{border-color:rgba(122,162,255,.55);color:#eaf2ff;background:rgba(35,54,105,.78)}
  .btn.gold{border-color:rgba(255,212,121,.35);color:#ffe0a3}
  .btn.gold:hover{background:rgba(255,212,121,.10);color:#fff0c9}

  /* 卡片：和首页 hero-card 同一套 */
  .card{
    position:relative;overflow:hidden;border-radius:22px;padding:22px 24px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.09), transparent 34%, rgba(255,255,255,.018) 66%, transparent),
      linear-gradient(135deg, rgba(20,33,70,.72), rgba(11,17,36,.60));
    border:1px solid var(--line-2);border-top-color:rgba(210,225,255,.36);
    backdrop-filter:blur(24px) saturate(145%);
    -webkit-backdrop-filter:blur(24px) saturate(145%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      inset 0 -1px 0 rgba(0,0,0,.22),
      0 26px 60px rgba(0,0,0,.28);
  }
  .card::after{
    content:"";position:absolute;right:-40px;top:-60px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle, rgba(122,162,255,.16), transparent 68%);pointer-events:none;
  }
  .card > *{position:relative;z-index:2}

  .head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:4px}
  .head .grow{flex:1;min-width:210px}
  .status{display:flex;align-items:center;gap:9px;font-size:17px;letter-spacing:.04em;color:#eef4ff}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);box-shadow:none;transition:var(--ease)}
  .dot.on{background:var(--teal);box-shadow:0 0 10px rgba(110,231,199,.8)}
  .hint{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.8;max-width:58ch}
  .meta{margin-top:8px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

  .switch{position:relative;width:54px;height:29px;flex:none;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .track{
    position:absolute;inset:0;border-radius:999px;border:1px solid rgba(110,145,235,.30);
    background:rgba(13,21,43,.75);transition:var(--ease)
  }
  .knob{
    position:absolute;top:4px;left:4px;width:19px;height:19px;border-radius:50%;
    background:#5b6a92;transition:var(--ease)
  }
  .switch input:checked + .track{background:rgba(255,212,121,.18);border-color:rgba(255,212,121,.45)}
  .switch input:checked + .track .knob{transform:translateX(25px);background:var(--gold);box-shadow:0 0 14px rgba(255,212,121,.55)}

  .confirm{display:none;margin-top:16px}
  .confirm.on{display:block}
  .confirm-box{
    border:1px solid rgba(255,212,121,.22);border-radius:16px;padding:14px 16px;
    background:rgba(255,212,121,.05);font-size:11.5px;line-height:1.9;color:#e6d6ae
  }
  .confirm-actions{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}

  .nav{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:9px}
  .nav-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .nav-row:empty{display:none}
  .nav-row::-webkit-scrollbar{height:5px}
  .nav-row::-webkit-scrollbar-thumb{background:rgba(110,145,235,.25);border-radius:3px}
  .chip{
    flex:none;cursor:pointer;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:rgba(20,31,62,.55);
    transition:var(--ease)
  }
  .chip:hover{color:#eaf2ff;border-color:rgba(122,162,255,.45);background:rgba(35,54,105,.6)}
  .chip.lv2{font-size:11.5px;padding:6px 12px;color:#5f7099}
  .chip.on{
    color:#332506;border-color:rgba(255,212,121,.55);font-weight:500;
    background:linear-gradient(135deg,var(--gold),#ffbe4d)
  }
  .chip .n{opacity:.6;font-size:10px;margin-left:6px}

  .entries{margin-top:22px;padding-top:6px;border-top:1px solid var(--line)}
  .entry{position:relative;padding:16px 0 16px 22px}
  .entry::before{
    content:"";position:absolute;left:0;top:22px;width:6px;height:6px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 10px rgba(255,212,121,.6)
  }
  .entry::after{
    content:"";position:absolute;left:2.5px;top:32px;bottom:-6px;width:1px;
    background:linear-gradient(180deg,rgba(110,145,235,.28),transparent)
  }
  .entry:last-child::after{display:none}
  .entry-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px}
  .t{font-family:Consolas,"Cascadia Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.06em}
  .tag{
    font-size:10px;letter-spacing:.08em;color:rgba(255,212,121,.92);
    border:1px solid rgba(255,212,121,.24);border-radius:999px;padding:2px 9px;
    background:rgba(255,212,121,.05)
  }
  .body{font-size:13.5px;line-height:2;color:#dbe6ff;white-space:pre-wrap;word-break:break-word}

  .empty{padding:56px 20px;text-align:center;color:var(--dim);font-size:12.5px;line-height:2}
  .empty svg{display:block;margin:0 auto 12px;opacity:.55}

  @media (max-width:720px){
    body{padding:24px 16px 44px}
    .card{padding:18px 18px;border-radius:20px}
    h1{letter-spacing:.08em}
    .body{font-size:13px;line-height:1.95}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">HEXING MEMORY / HEART</div>
      <h1>鱼的心路历程</h1>
      <div class="sub">她自己写的当天心情与心路 · 只存在这台机器上，不上传、不进记忆检索</div>
    </div>
    <div class="actions">
      <a class="btn" href="/">← 返回总览</a>
    </div>
  </header>

  <section class="card">
    <div class="head">
      <div class="grow">
        <div class="status"><span class="dot" id="dot"></span><span id="stateTitle">—</span></div>
        <div class="hint" id="stateHint">加载中…</div>
        <div class="meta" id="stateMeta"></div>
      </div>
      <label class="switch" title="开启 / 关闭">
        <input type="checkbox" id="toggle">
        <span class="track"><span class="knob"></span></span>
      </label>
    </div>

    <div class="confirm" id="confirm">
      <div class="confirm-box">
        开启后，她会在自己觉得该记的时候写一两句当天的心情，一天天攒成心路历程。
        存在你本机 <code>data/heart/</code>，不上传、不进记忆检索，随时可以关。
        <div class="confirm-actions">
          <button class="btn gold" id="doEnable">开启</button>
          <button class="btn" id="cancelEnable">算了</button>
        </div>
      </div>
    </div>

    <div class="nav">
      <div class="nav-row" id="yearRow"></div>
      <div class="nav-row" id="monthRow"></div>
      <div class="nav-row" id="dayRow"></div>
    </div>
    <div class="entries" id="entries"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
let currentDay = '';
let selYear = '';
let selMonth = '';

function fmtClock(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderState() {
  const on = Boolean(state && state.enabled);
  $('toggle').checked = on;
  $('dot').className = 'dot' + (on ? ' on' : '');
  $('stateTitle').textContent = on ? '已开启' : '已关闭';
  $('stateHint').textContent = on
    ? '她会在觉得该记的时候写一两句，存在本机；关了就不再写、也不再加载。'
    : '开启后她会在本机写日记，随时可关。不开也完全不影响使用。';

  const bits = [];
  if (state) {
    if (on) {
      bits.push(`这天 ${(state.entries || []).length} 条`);
      bits.push(`共 ${(state.days || []).length} 天`);
    }
    if (state.updatedAt && state.configured) {
      const who = state.updatedBy === 'model' ? '由模型' : '由你';
      bits.push(`${who}于 ${fmtClock(state.updatedAt)} ${on ? '开启' : '关闭'}`);
    }
    bits.push(`核对于 ${fmtClock(new Date().toISOString())}`);
  }
  $('stateMeta').textContent = bits.join(' · ');
}

function chip(text, on, onClick, count, lv2) {
  const n = document.createElement('div');
  n.className = 'chip' + (lv2 ? ' lv2' : '') + (on ? ' on' : '');
  n.textContent = text;
  if (count != null) {
    const s = document.createElement('span');
    s.className = 'n';
    s.textContent = count;
    n.appendChild(s);
  }
  n.addEventListener('click', onClick);
  return n;
}

// 三级目录：只到"年"这一层，往下是月、日。页面上没有任何文件路径可点，
// 接口也只认 YYYY-MM-DD，跳不进别的文件夹。
function renderNav() {
  const days = (state && state.days) || [];
  const today = (state && state.today) || '';
  const years = [...new Set(days.map((d) => d.date.slice(0, 4)))].sort().reverse();

  const yBox = $('yearRow');
  yBox.innerHTML = '';
  if (!years.length) {
    if (today) yBox.appendChild(chip(today.slice(0, 4) + ' 年', true, () => {}));
    $('monthRow').innerHTML = '';
    $('dayRow').innerHTML = '';
    return;
  }
  if (!selYear || !years.includes(selYear)) selYear = years[0];
  const firstIn = (prefix) => (days.find((d) => d.date.startsWith(prefix)) || {}).date || '';
  for (const y of years) {
    yBox.appendChild(chip(y + ' 年', y === selYear, () => {
      selYear = y; selMonth = '';
      const n = firstIn(y);
      if (n) load(n); else renderNav();
    }));
  }

  const months = [...new Set(days.filter((d) => d.date.startsWith(selYear)).map((d) => d.date.slice(5, 7)))]
    .sort().reverse();
  if (!selMonth || !months.includes(selMonth)) selMonth = months[0] || '';
  const mBox = $('monthRow');
  mBox.innerHTML = '';
  for (const m of months) {
    mBox.appendChild(chip(parseInt(m, 10) + ' 月', m === selMonth, () => {
      selMonth = m;
      const n = firstIn(selYear + '-' + m);
      if (n) load(n); else renderNav();
    }, null, true));
  }

  const dBox = $('dayRow');
  dBox.innerHTML = '';
  const list = days.filter((d) => d.date.slice(0, 7) === selYear + '-' + selMonth);
  for (const d of list) {
    dBox.appendChild(chip(d.date.slice(5), d.date === currentDay, () => load(d.date), d.count, true));
  }
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function renderEntries() {
  const box = $('entries');
  box.innerHTML = '';
  const list = (state && state.entries) || [];

  if (!state || !state.enabled) {
    const wrap = el('div', 'empty');
    wrap.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h7M8 12h7"/></svg>'
      + '<div>日记还没开。打开上面的开关，她才会开始写。</div>';
    box.appendChild(wrap);
    return;
  }
  if (!list.length) {
    const isToday = state.day === state.today;
    const wrap = el('div', 'empty');
    wrap.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l3 1.8"/></svg>'
      + '<div>' + (isToday ? '今天还没写。' : '这天没有记录。') + '</div>';
    box.appendChild(wrap);
    return;
  }
  for (const r of list) {
    const row = el('div', 'entry');
    const head = el('div', 'entry-head');
    head.appendChild(el('span', 't', String(r.t || '').slice(11)));
    for (const tag of (r.tags || [])) head.appendChild(el('span', 'tag', tag));
    row.appendChild(head);
    row.appendChild(el('div', 'body', r.text));
    box.appendChild(row);
  }
}

async function load(day) {
  try {
    const q = day ? ('?day=' + encodeURIComponent(day)) : '';
    const r = await fetch('/api/heart' + q, { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j || j.ok === false) throw new Error((j && j.error) || ('HTTP ' + r.status));
    state = j;
    currentDay = j.day || j.today;
    selYear = currentDay.slice(0, 4);
    selMonth = currentDay.slice(5, 7);
    renderState();
    renderNav();
    renderEntries();
  } catch (e) {
    $('stateTitle').textContent = '读取失败';
    $('stateHint').textContent = String(e && e.message ? e.message : e);
    $('stateMeta').textContent = '';
  }
}

// 开关：关 → 立即生效；开 → 行内确认一次（不是弹窗，也不做二次确认）
$('toggle').addEventListener('click', async (ev) => {
  if (!state) return;
  if (state.enabled) {
    ev.preventDefault();
    $('toggle').checked = false;
    await postEnabled(false);
  } else {
    ev.preventDefault();
    $('toggle').checked = false;
    if (state.configured) { await postEnabled(true); return; }
    $('confirm').classList.add('on');
  }
});

$('doEnable').addEventListener('click', async () => {
  $('confirm').classList.remove('on');
  await postEnabled(true);
});
$('cancelEnable').addEventListener('click', () => {
  $('confirm').classList.remove('on');
});

async function postEnabled(enabled) {
  try {
    const r = await fetch('/api/heart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled }),
    });
    const j = await r.json();
    if (!r.ok || !j || j.ok === false) throw new Error((j && j.error) || ('HTTP ' + r.status));
    await load(currentDay);
  } catch (e) {
    $('stateHint').textContent = '切换失败：' + (e && e.message ? e.message : e);
    $('toggle').checked = Boolean(state && state.enabled);
  }
}

load();
</script>
</body>
</html>
