<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>核星记忆 · 真 3D 链网</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #02040b; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c9d6ff;
    cursor: default;
    user-select: none;
    background:
      radial-gradient(ellipse at 50% 42%, #0b1733 0%, #060c1c 42%, #02040b 78%),
      radial-gradient(ellipse at 18% 78%, rgba(44, 30, 92, .28) 0%, transparent 55%),
      radial-gradient(ellipse at 82% 22%, rgba(20, 62, 92, .22) 0%, transparent 52%);
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    touch-action: none;
    cursor: grab;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.16) 72%, rgba(0,0,0,.55) 100%);
  }
  #labels {
    position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden;
  }
  .label {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    font-size: 10px; line-height: 1.2;
    color: rgba(150,220,205,.82);
    text-shadow: 0 1px 8px #000, 0 0 5px #000;
    opacity: 0;
    transition: color .18s ease;
    will-change: left, top, opacity;
  }
  .label.root { font-size: 14px; color: rgba(255,240,200,.96); font-weight: 500; }
  .label.branch { font-size: 13px; color: rgba(190,208,255,.94); }
  .label.child { font-size: 11px; }
  .label.grand { font-size: 9px; color: rgba(140,210,195,.7); }
  .label.hot { color: #eaf4ff; text-shadow: 0 0 10px rgba(140,190,255,.8), 0 1px 8px #000; }

  #hud {
    position: absolute; top: 22px; left: 26px; z-index: 10;
    font-size: 12px; line-height: 1.9; letter-spacing: .4px;
    color: #6f82b8;
  }
  #hud b { color: #9fb4ff; font-weight: 500; }
  #hud .dim { color: #3f4d6e; }

  #nav {
    position: absolute; top: 22px; right: 26px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
  }
  #nav a, #nav button {
    display: inline-flex; align-items: center; gap: 6px;
    color: #9fb4ff; text-decoration: none; font-size: 12px;
    border: 1px solid rgba(90,120,220,.25); border-radius: 999px;
    padding: 7px 13px; background: rgba(12,18,38,.55);
    backdrop-filter: blur(8px); transition: .2s ease;
    font-family: inherit; cursor: pointer;
  }
  #nav button { display: none; color: #ffd479; border-color: rgba(255,212,121,.28); }
  #nav button.show { display: inline-flex; }
  #nav a:hover, #nav button:hover { color: #eaf2ff; border-color: rgba(122,162,255,.55); }

  #panel {
    position: absolute; right: 24px; bottom: 24px; z-index: 10;
    width: 320px; max-height: 60vh; overflow-y: auto;
    background: rgba(12, 18, 38, .92);
    border: 1px solid rgba(90, 120, 220, .28);
    border-radius: 14px; padding: 16px 18px;
    backdrop-filter: blur(12px);
    opacity: 0; transform: translateY(8px);
    transition: .25s ease;
    pointer-events: none;
  }
  #panel.show { opacity: 1; transform: none; pointer-events: auto; }
  #panel h3 {
    font-size: 15px; font-weight: 500; margin-bottom: 10px; color: #e8efff;
    display: flex; align-items: center; gap: 8px;
  }
  #panel .tag {
    font-size: 10px; padding: 2px 7px; border-radius: 20px;
    background: rgba(90, 120, 220, .2); color: #8fa6e8;
  }
  #panel .meta { font-size: 11px; color: #5f7099; margin-bottom: 10px; }
  #panel .head {
    font-size: 12px; line-height: 1.8; color: #93a4cc;
    background: rgba(255,255,255,.03); border-left: 2px solid rgba(90,120,220,.4);
    padding: 8px 10px; border-radius: 4px; margin-bottom: 10px; white-space: pre-wrap;
  }
  #panel .node {
    font-size: 11px; line-height: 1.7; color: #7d8db8;
    padding: 5px 0; border-bottom: 1px dashed rgba(90,120,220,.12);
  }
  #panel .node:last-child { border-bottom: none; }
  #panel .who { color: #6b8ad4; margin-right: 5px; }

  #legend {
    position: absolute; left: 26px; bottom: 24px; z-index: 10;
    font-size: 11px; color: #4d5c82; line-height: 2;
  }
  #legend i {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 7px; vertical-align: middle;
  }
  @media (max-width: 560px) {
    #nav { top: 92px; right: 14px; }
    #hud { font-size: 11px; }
    #panel { left: 12px; right: 12px; width: auto; bottom: 12px; max-height: 42vh; }
    body.panel-open #legend { display: none; }
  }

  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #02040b;
    color: #6f82b8; font-size: 12px; letter-spacing: 1px;
    transition: opacity .4s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="labels"></div>

<div id="nav">
  <button id="focusBack" type="button">← 返回太阳系</button>

</div>

<div id="hud">
  <b>核星记忆</b> · 链网宇宙 · 以核星为心<span id="ver" class="dim"></span><br>

<div id="panel"></div>

<script>
  window.__viewerReady = false;
  window.__viewerErrors = [];
  window.addEventListener('error', function (e) { window.__viewerErrors.push(String((e && e.message) || e)); });
  window.addEventListener('unhandledrejection', function (e) {
    window.__viewerErrors.push(String((e && e.reason && e.reason.message) || (e && e.reason) || e));
  });
  setTimeout(function () {
    if (!window.__viewerReady) {
      var el = document.getElementById('loading');
      if (el && !el.classList.contains('hide')) el.textContent = '3D 资源加载失败，请检查 vendor/three.module.min.js';
    }
  }, 8000);
</script>

<script type="module">
import * as THREE from './vendor/three.module.min.js';

const canvas = document.getElementById('c');
const panel = document.getElementById('panel');
const focusBackEl = document.getElementById('focusBack');
const hintEl = document.getElementById('hint');
const statEl = document.getElementById('stat');
const labelsEl = document.getElementById('labels');
const loadingEl = document.getElementById('loading');

let W = window.innerWidth;
let H = window.innerHeight;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (err) {
  loadingEl.textContent = 'WebGL 初始化失败：' + (err && err.message ? err.message : err);
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.setClearColor(0x02040b, 0);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02040b, 0.006);
const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 220);

let yaw = 0.55;
let pitch = 0.55;
let distance = 15;
let solarDistance = 15;
let focusBody = null;
let orbitLines = [];
let dragging = false;
let lastX = 0, lastY = 0, moved = 0;
let hovered = null;
let selected = null;

const bodies = [];
const clickable = [];
const fitPoints = [];
const ORIGIN = new THREE.Vector3(0, 0, 0);
let occluders = [];
let rootBody = null;
let data = null;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const labelRaycaster = new THREE.Raycaster();
const labelPointer = new THREE.Vector2();

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function fail(msg) {
  loadingEl.textContent = msg;
  loadingEl.classList.remove('hide');
  console.error('[viewer3d]', msg);
}

/* ── 程序化贴图 ─────────────────────────── */
function rngFor(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function nameSeed(name) {
  let h = 2166136261;
  for (let i = 0; i < name.length; i++) {
    h ^= name.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

const PALETTES = {
  root:   { base: '#b96b1e', bands: ['#ffd37a', '#8f4510', '#ffe7ae', '#d47a1d'], spot: '#6e2c06' },
  branch: { base: '#304f96', bands: ['#8fb2ff', '#1e3470', '#b7cdff', '#4d72c4'], spot: '#14264f' },
  branchViolet: { base: '#3b2f7a', bands: ['#b9a4ff', '#241a55', '#ded4ff', '#6f57c9'], spot: '#160f38' },
  branchTeal: { base: '#155f57', bands: ['#8ff5dc', '#0b3f39', '#c8fff2', '#2aa892'], spot: '#062f2a' },
  leaf:   { base: '#176b60', bands: ['#7fe8d0', '#0d4d45', '#b8fff0', '#2ca38b'], spot: '#073c35' },
};

const texCache = new Map();
function planetTexture(kind, name, paletteKey) {
  const key = kind + ':' + (paletteKey || '') + ':' + name;
  if (texCache.has(key)) return texCache.get(key);
  const pal = PALETTES[paletteKey || kind] || PALETTES.leaf;
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  const rnd = rngFor(nameSeed(name));

  g.fillStyle = pal.base;
  g.fillRect(0, 0, 512, 256);

  const gloss = g.createLinearGradient(0, 0, 0, 256);
  gloss.addColorStop(0, 'rgba(0,0,0,.32)');
  gloss.addColorStop(.22, 'rgba(255,255,255,.06)');
  gloss.addColorStop(.55, 'rgba(255,255,255,.02)');
  gloss.addColorStop(.82, 'rgba(0,0,0,.10)');
  gloss.addColorStop(1, 'rgba(0,0,0,.46)');
  g.fillStyle = gloss;
  g.fillRect(0, 0, 512, 256);

  for (let i = 0; i < 20; i++) {
    const y = rnd() * 256;
    const h = 3 + rnd() * 22;
    g.globalAlpha = .10 + rnd() * .18;
    g.fillStyle = pal.bands[Math.floor(rnd() * pal.bands.length)];
    g.fillRect(0, y, 512, h);
  }
  g.globalAlpha = 1;

  for (let i = 0; i < 64; i++) {
    const x = rnd() * 512, y = rnd() * 256;
    const rx = 8 + rnd() * 50, ry = 2 + rnd() * 10;
    g.globalAlpha = .04 + rnd() * .07;
    g.fillStyle = pal.spot;
    g.beginPath();
    g.ellipse(x, y, rx, ry, rnd() * .4 - .2, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;

  for (let i = 0; i < 1500; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (rnd() * .055).toFixed(3) + ')';
    g.fillRect(rnd() * 512, rnd() * 256, 1, 1);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  texCache.set(key, tex);
  return tex;
}

function makeSunTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  const base = g.createLinearGradient(0, 0, 0, 256);
  base.addColorStop(0, '#fffef8');
  base.addColorStop(.32, '#fff8d0');
  base.addColorStop(.68, '#ffeb9a');
  base.addColorStop(1, '#ffcf62');
  g.fillStyle = base;
  g.fillRect(0, 0, 512, 256);

  const rnd = rngFor(20260504);
  for (let i = 0; i < 240; i++) {
    const x = rnd() * 512, y = rnd() * 256;
    const r = 5 + rnd() * 34;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    const hot = rnd() > .42;
    grad.addColorStop(0, hot ? 'rgba(255,255,236,.38)' : 'rgba(196,82,12,.10)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  for (let i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(255,250,220,' + (rnd() * .05).toFixed(3) + ')';
    g.fillRect(rnd() * 512, rnd() * 256, 1, 1);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

function makeFlareTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  const core = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  core.addColorStop(0, 'rgba(255,255,246,1)');
  core.addColorStop(.10, 'rgba(255,242,196,.92)');
  core.addColorStop(.34, 'rgba(255,196,98,.28)');
  core.addColorStop(1, 'rgba(255,150,40,0)');
  g.fillStyle = core;
  g.fillRect(0, 0, 256, 256);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeDiskTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(256, 256, 0, 256, 256, 256);
  rg.addColorStop(0, 'rgba(255,210,120,0)');
  rg.addColorStop(.34, 'rgba(255,196,92,0)');
  rg.addColorStop(.50, 'rgba(255,218,142,.46)');
  rg.addColorStop(.63, 'rgba(255,174,66,.22)');
  rg.addColorStop(.82, 'rgba(255,150,40,.06)');
  rg.addColorStop(1, 'rgba(255,140,30,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeRockTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const rnd = rngFor(9917);
  g.translate(32, 32);
  g.beginPath();
  const n = 7;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = 12 + rnd() * 10;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i) g.lineTo(x, y); else g.moveTo(x, y);
  }
  g.closePath();
  g.fillStyle = 'rgba(198,220,240,.96)';
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,.6)';
  g.lineWidth = 1.4;
  g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeDebrisTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  rg.addColorStop(0, 'rgba(255,255,255,0)');
  rg.addColorStop(.36, 'rgba(255,255,255,0)');
  rg.addColorStop(.52, 'rgba(255,255,255,.68)');
  rg.addColorStop(.64, 'rgba(255,255,255,.22)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,255,255,.95)');
  grad.addColorStop(.18, 'rgba(255,255,255,.55)');
  grad.addColorStop(.48, 'rgba(255,255,255,.12)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

function makeStarTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(.22, 'rgba(255,255,255,.85)');
  grad.addColorStop(.55, 'rgba(255,255,255,.15)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function makeRingTexture(dashed) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.translate(64, 64);
  g.strokeStyle = 'rgba(255,255,255,1)';
  g.lineWidth = 2;
  if (dashed) g.setLineDash([5, 6]);
  g.beginPath();
  g.arc(0, 0, 48, 0, Math.PI * 2);
  g.stroke();
  return new THREE.CanvasTexture(c);
}

/* ── 场景基础 ───────────────────────────── */
const starTex = makeStarTexture();
function makeStars(count, size, rMin, rMax) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const color = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1;
    const theta = Math.random() * Math.PI * 2;
    const r = Math.sqrt(1 - u * u);
    const rad = rMin + Math.random() * (rMax - rMin);
    positions[i * 3] = r * Math.cos(theta) * rad;
    positions[i * 3 + 1] = u * rad;
    positions[i * 3 + 2] = r * Math.sin(theta) * rad;

    const roll = Math.random();
    if (roll < .13) color.setHSL(.12, .55, .82);
    else if (roll < .28) color.setHSL(.58, .35, .88);
    else color.setHSL(.6, .12, .92);
    const lum = .75 + Math.random() * .25;
    colors[i * 3] = color.r * lum;
    colors[i * 3 + 1] = color.g * lum;
    colors[i * 3 + 2] = color.b * lum;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size, map: starTex, vertexColors: true, transparent: true,
    alphaTest: .01, depthWrite: false, blending: THREE.AdditiveBlending,
    sizeAttenuation: true, fog: false, opacity: .95,
  });
  return new THREE.Points(geo, mat);
}
const starsNear = makeStars(6800, .35, 42, 68);
const starsBright = makeStars(360, .62, 48, 82);
scene.add(starsNear, starsBright);

scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x0a0618, 1.05));
const sunLight = new THREE.DirectionalLight(0xe8f0ff, 2.4);
sunLight.position.set(6, 9, 5);
scene.add(sunLight);
const rootLight = new THREE.PointLight(0xffb35c, 34, 40, 2);
scene.add(rootLight);

const glowTex = makeGlowTexture();
const sunTex = makeSunTexture();
const flareTex = makeFlareTexture();
const diskTex = makeDiskTexture();
const rockTex = makeRockTexture();
const debrisTex = makeDebrisTexture();

function addNebula(x, y, z, scale, color, opacity) {
  const mat = new THREE.SpriteMaterial({
    map: glowTex,
    color,
    transparent: true,
    opacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const sprite = new THREE.Sprite(mat);
  sprite.position.set(x, y, z);
  sprite.scale.setScalar(scale);
  sprite.renderOrder = 0;
  scene.add(sprite);
  return sprite;
}
addNebula(-16, 7, -36, 46, 0x243b8f, .16);
addNebula(18, -7, -42, 56, 0x4a246f, .13);
addNebula(2, 15, -50, 40, 0x1d5a78, .10);

const ringDashedTex = makeRingTexture(true);
const ringSolidTex = makeRingTexture(false);
const planetGeo = new THREE.SphereGeometry(1, 48, 32);
const rockGeo = new THREE.IcosahedronGeometry(1, 0);

const selectionSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: ringSolidTex,
  color: 0x9fe8ff,
  transparent: true,
  opacity: .9,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
}));
selectionSprite.visible = false;
selectionSprite.renderOrder = 2;
scene.add(selectionSprite);

const sunFlare = new THREE.Sprite(new THREE.SpriteMaterial({
  map: flareTex,
  color: 0xffd28a,
  transparent: true,
  opacity: .32,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
}));
sunFlare.position.set(0, 0, 0);
sunFlare.scale.setScalar(4.2);
sunFlare.renderOrder = 2;
scene.add(sunFlare);

const sunDisk = new THREE.Mesh(
  new THREE.CircleGeometry(2.5, 128),
  new THREE.MeshBasicMaterial({
    map: diskTex,
    transparent: true,
    opacity: .55,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    toneMapped: false,
  })
);
sunDisk.rotation.x = -Math.PI / 2 + 0.42;
sunDisk.rotation.z = 0.28;
sunDisk.renderOrder = 0;
scene.add(sunDisk);

const EMISSIVE = {
  root: 0xffb347,
  branch: 0x0e1d46,
  leaf: 0x073a33,
};

function orbitPoint(center, radius, tilt, angle, roll = 0, ecc = 0) {
  const a = radius;
  const b = radius * (1 - ecc);
  const x = Math.cos(angle) * a;
  const z = Math.sin(angle) * b;
  const y = z * Math.sin(tilt);
  const zt = z * Math.cos(tilt);
  const xr = x * Math.cos(roll) + zt * Math.sin(roll);
  const zr = -x * Math.sin(roll) + zt * Math.cos(roll);
  return new THREE.Vector3(center.x + xr, center.y + y, center.z + zr);
}

function addOrbit(center, radius, tilt, color, opacity, roll = 0, ecc = 0) {
  const pts = [];
  const seg = 168;
  for (let i = 0; i < seg; i++) {
    pts.push(orbitPoint(ORIGIN, radius, tilt, (i / seg) * Math.PI * 2, roll, ecc));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  for (const p of pts) fitPoints.push(p.clone().add(center));
  const line = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({
    color, transparent: true, opacity, depthWrite: false,
    blending: THREE.AdditiveBlending,
  }));
  line.position.copy(center);
  line.renderOrder = 1;
  scene.add(line);
  return line;
}

function createBody(chain, level, pos, radius, parentName, tone, paletteKey) {
  const kind = level === 0 ? 'root' : (level === 1 ? 'branch' : 'leaf');
  const labelClass = level === 0 ? 'root' : (level === 1 ? 'branch' : (level === 2 ? 'child' : 'grand'));
  const body = {
    chain,
    level,
    pos: pos.clone(),
    radius,
    parentName,
    kind,
    seed: nameSeed(chain.name || ''),
  };
  fitPoints.push(pos.clone());

  const isRock = level >= 2;
  const mat = level === 0
    ? new THREE.MeshBasicMaterial({ map: sunTex })
    : isRock
      ? new THREE.MeshStandardMaterial({
        color: new THREE.Color(tone || 0x9fb4c8),
        roughness: .95,
        metalness: .03,
        flatShading: true,
        emissive: 0x0a1a22,
        emissiveIntensity: .3,
      })
      : new THREE.MeshStandardMaterial({
        map: planetTexture(kind, chain.name + ':' + level + ':' + parentName, paletteKey),
        color: new THREE.Color(tone || 0xffffff),
        roughness: .66,
        metalness: .06,
        emissive: new THREE.Color(EMISSIVE[kind]),
        emissiveIntensity: .035,
      });
  const mesh = new THREE.Mesh(isRock ? rockGeo : planetGeo, mat);
  mesh.position.copy(pos);
  if (isRock) {
    mesh.scale.set(radius * 1.15, radius * .72, radius * .95);
    mesh.rotation.set(
      (body.seed % 100) / 100 * Math.PI,
      (body.seed % 73) / 73 * Math.PI,
      (body.seed % 51) / 51 * Math.PI
    );
  } else {
    mesh.scale.setScalar(radius);
  }
  mesh.userData.body = body;
  body.mesh = mesh;
  body.isRock = isRock;
  body.baseScale = isRock ? [1.15, .72, .95] : [1, 1, 1];
  body.spin = isRock
    ? { x: .001 + (body.seed % 7) * .0003, y: .0015 + (body.seed % 5) * .0004, z: .0008 }
    : null;
  scene.add(mesh);
  clickable.push(mesh);

  const glowMat = new THREE.SpriteMaterial({
    map: glowTex,
    color: level === 0 ? 0xffc46b : (level === 1 ? 0x7198ff : 0x66e4c8),
    transparent: true,
    opacity: level === 0 ? .85 : (level === 1 ? .5 : (isRock ? .14 : .3)),
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const glow = new THREE.Sprite(glowMat);
  glow.position.copy(pos);
  glow.scale.setScalar(radius * (level === 0 ? 3.8 : (level === 1 ? 3.2 : (isRock ? 2.6 : 3.0))));
  body.glow = glow;
  body.glowBase = glowMat.opacity;
  scene.add(glow);

  if (level > 0 && (chain.needHeader || chain.needRefresh)) {
    const im = new THREE.SpriteMaterial({
      map: chain.needHeader ? ringDashedTex : ringSolidTex,
      color: 0xffb060,
      transparent: true,
      opacity: chain.needHeader ? .8 : .35,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    const ind = new THREE.Sprite(im);
    ind.position.copy(pos);
    ind.scale.setScalar(radius * 4.6);
    body.indicator = ind;
    scene.add(ind);
  }

  const el = document.createElement('div');
  el.className = 'label ' + labelClass;
  el.textContent = chain.name;
  labelsEl.appendChild(el);
  body.labelEl = el;

  bodies.push(body);
  return body;
}

function chainWeight(chain) {
  let n = 1 + (chain.nodes || 0);
  for (const c of chain.children || []) n += chainWeight(c);
  return n;
}

function buildScene(data) {
  const rootName = (data.根 && data.根.name) || '核星';
  const origin = new THREE.Vector3(0, 0, 0);
  rootBody = createBody({ name: rootName, nodes: 0 }, 0, origin, .9, '');

  const roots = data.树 || [];
  const ORBITS = [
    { radius: 2.80, tilt: -0.10, roll: 0.12, ecc: .10, color: 0x587cff, palette: 'branch' },
    { radius: 3.70, tilt: 0.07, roll: -0.18, ecc: .12, color: 0x6f8dff, palette: 'branch' },
    { radius: 4.60, tilt: -0.04, roll: 0.22, ecc: .14, color: 0x8f7bff, palette: 'branchViolet' },
    { radius: 5.50, tilt: 0.12, roll: -0.08, ecc: .16, color: 0x7aa2ff, palette: 'branch' },
    { radius: 6.40, tilt: -0.09, roll: 0.16, ecc: .10, color: 0x8f7bff, palette: 'branchViolet' },
    { radius: 7.30, tilt: 0.05, roll: -0.24, ecc: .13, color: 0x49d7c0, palette: 'branchTeal' },
    { radius: 8.20, tilt: -0.13, roll: 0.06, ecc: .17, color: 0x6f8dff, palette: 'branch' },
    { radius: 9.10, tilt: 0.10, roll: -0.12, ecc: .11, color: 0x8f7bff, palette: 'branchViolet' },
    { radius: 10.00, tilt: -0.02, roll: 0.20, ecc: .15, color: 0x49d7c0, palette: 'branchTeal' },
  ];
  orbitLines = [];

  roots.forEach((c, i) => {
    const o = ORBITS[i % ORBITS.length];
    const phase = i * 2.399963229728653 + 0.6;
    const ppos = orbitPoint(origin, o.radius, o.tilt, phase, o.roll, o.ecc);
    const line = addOrbit(origin, o.radius, o.tilt, o.color, .20, o.roll, o.ecc);
    orbitLines.push(line);

    const weight = chainWeight(c);
    const pr = 0.34 + Math.sqrt(Math.min(weight, 60) / 60) * 0.27;
    const body = createBody(c, 1, ppos, pr, rootName, null, o.palette);
    body.orbit = {
      radius: o.radius, tilt: o.tilt, roll: o.roll, ecc: o.ecc,
      phase, speed: 0.018 + (i % 4) * .003, parent: null,
    };
    body.orbitLine = line;
    body.solarVisible = true;

    const kids = c.children || [];
    const nodeSum = kids.reduce((n, k) => n + (k.nodes || 0), 0);
    if (kids.length) {
      const count = Math.round(Math.min(110, 24 + kids.length * 14 + Math.min(nodeSum, 80) * .5));
      const group = new THREE.Group();
      const posArr = new Float32Array(count * 3);
      const rnd = rngFor(nameSeed(c.name + ':debris'));
      for (let d = 0; d < count; d++) {
        const a = rnd() * Math.PI * 2;
        const r = 0.82 + rnd() * 0.58;
        posArr[d * 3] = Math.cos(a) * r;
        posArr[d * 3 + 1] = (rnd() - .5) * 0.10;
        posArr[d * 3 + 2] = Math.sin(a) * r;
      }
      const dg = new THREE.BufferGeometry();
      dg.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      const dm = new THREE.PointsMaterial({
        size: .16, map: rockTex,
        color: new THREE.Color(o.color).lerp(new THREE.Color(0xffffff), .55),
        transparent: true, opacity: .9,
        depthWrite: false, blending: THREE.AdditiveBlending,
        sizeAttenuation: true,
      });
      const pts = new THREE.Points(dg, dm);
      group.add(pts);
      const disk = new THREE.Mesh(
        new THREE.CircleGeometry(1.5, 72),
        new THREE.MeshBasicMaterial({
          map: debrisTex, color: o.color, transparent: true, opacity: .75,
          side: THREE.DoubleSide, depthWrite: false,
          blending: THREE.AdditiveBlending, toneMapped: false,
        })
      );
      disk.rotation.x = -Math.PI / 2;
      disk.renderOrder = 0;
      group.add(disk);
      group.position.copy(ppos);
      group.rotation.x = o.tilt + 0.22;
      group.rotation.z = o.roll;
      body.debris = group;
      body.debrisSpeed = .04 + (i % 3) * .012;
      scene.add(group);
      for (let a = 0; a < 8; a++) {
        fitPoints.push(orbitPoint(ppos, 1.45, o.tilt, (a / 8) * Math.PI * 2, o.roll));
      }
    }

    kids.forEach((k, j2) => {
      const ringR = 0.84 + j2 * 0.17 + Math.min(kids.length, 4) * .02;
      const mecc = 0.03 + (j2 % 3) * .02;
      const ma = (j2 / Math.max(1, kids.length)) * Math.PI * 2 + i * .55;
      const mt = o.tilt + (((j2 * 5) % 7) - 3) * .045;
      const mpos = orbitPoint(ppos, ringR, mt, ma, 0, mecc);
      const mWeight = 1 + (k.nodes || 0);
      const mrad = 0.09 + Math.sqrt(Math.min(mWeight, 20) / 20) * 0.04;
      const rockColor = new THREE.Color(0x8a99a8).lerp(new THREE.Color(o.color), .25);
      const rock = createBody(k, 2, mpos, mrad, c.name, rockColor.getHex());
      rock.solarVisible = false;
      rock.orbit = {
        radius: ringR, tilt: mt, roll: 0, ecc: mecc,
        phase: ma, speed: 0.30 - j2 * .03, parent: body,
      };
      const mline = addOrbit(mpos, ringR, mt, 0x49d7c0, .07, 0, mecc);
      mline.userData.parentBody = body;
      rock.orbitLine = mline;

      const gkids = k.children || [];
      gkids.forEach((gk, gj) => {
        const ga = (gj / Math.max(1, gkids.length)) * Math.PI * 2 + j2 * .6;
        const gt = mt + (((gj * 3) % 5) - 2) * .05;
        const gpos = orbitPoint(mpos, .20, gt, ga);
        const gWeight = 1 + (gk.nodes || 0);
        const grandBody = createBody(gk, 3, gpos, 0.045 + Math.sqrt(Math.min(gWeight, 10) / 10) * 0.018, k.name, 0x7fd8c4);
        grandBody.solarVisible = false;
        grandBody.orbit = {
          radius: .20, tilt: gt, roll: 0, ecc: 0,
          phase: ga, speed: 0.55 + gj * .04, parent: rock,
        };
        const gline = addOrbit(mpos, .20, gt, 0x49d7c0, .04);
        gline.userData.parentBody = rock;
        grandBody.orbitLine = gline;
      });
    });
  });

  occluders = bodies.filter((b) => b.level <= 1).map((b) => b.mesh);

  const total = countChains(roots);
  statEl.textContent = `${roots.length} 个分支 · ${total.n} 条链 · ${total.nodes} 个节点 · 真 3D`;
  loadingEl.classList.add('hide');
  window.__viewerReady = true;
  applyVisibility();
  resize();
}

function countChains(list) {
  let n = 0, nodes = 0;
  for (const c of (list || [])) {
    n++;
    nodes += c.nodes || 0;
    const sub = countChains(c.children || []);
    n += sub.n;
    nodes += sub.nodes;
  }
  return { n, nodes };
}

/* ── 相机与交互 ─────────────────────────── */
function fitDistance() {
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const aspect = camera.aspect || 1;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const dir = new THREE.Vector3(Math.cos(yaw) * cp, sp, Math.sin(yaw) * cp);
  const forward = dir.clone().negate();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, forward).normalize();
  const margin = 1.1;
  let need = 0;
  for (const p of fitPoints) {
    const proj = p.dot(dir);
    const dx = Math.abs(p.dot(right)) / (margin * tan * aspect);
    const dy = Math.abs(p.dot(up)) / (margin * tan);
    need = Math.max(need, proj + dx, proj + dy);
  }
  return Math.max(8, need * 1.04);
}

function updateCamera() {
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const tx = focusBody ? focusBody.pos.x : 0;
  const ty = focusBody ? focusBody.pos.y : 0;
  const tz = focusBody ? focusBody.pos.z : 0;
  camera.position.set(
    tx + distance * Math.cos(yaw) * cp,
    ty + distance * sp,
    tz + distance * Math.sin(yaw) * cp
  );
  camera.lookAt(tx, ty, tz);
  camera.updateMatrixWorld();
}

function pickAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickable, false);
  return hits.length ? hits[0].object.userData.body : null;
}

function isInFocus(b) {
  let p = b;
  while (p) {
    if (p === focusBody) return true;
    p = p.orbit ? p.orbit.parent : null;
  }
  return false;
}

function applyVisibility() {
  const inFocus = !!focusBody;
  if (rootBody) {
    rootBody.mesh.visible = !inFocus;
    if (rootBody.glow) rootBody.glow.visible = !inFocus;
    rootBody.labelEl.style.display = inFocus ? 'none' : '';
  }
  if (sunFlare) sunFlare.visible = !inFocus;
  if (sunDisk) sunDisk.visible = !inFocus;
  orbitLines.forEach((l) => { l.visible = !inFocus; });

  for (const b of bodies) {
    if (b === rootBody) continue;
    const vis = inFocus ? isInFocus(b) : !!b.solarVisible;
    b.mesh.visible = vis;
    if (b.glow) b.glow.visible = vis;
    if (b.indicator) b.indicator.visible = vis;
    if (b.debris) b.debris.visible = vis && (b.chain.children || []).length > 0;
    b.labelEl.style.display = vis ? '' : 'none';
    if (b.orbitLine && b.orbitLine.userData.parentBody) b.orbitLine.visible = vis;
  }
}

function enterFocus(body) {
  if (!body || body.level !== 1) return;
  const kids = body.chain.children || [];
  if (!kids.length) return;
  if (focusBody === body) { showPanel(body.chain.name); return; }
  focusBody = body;
  solarDistance = distance;
  distance = camera.aspect < 0.8 ? 6.4 : 4.8;
  selected = body;
  applyVisibility();
  if (focusBackEl) focusBackEl.classList.add('show');
  if (hintEl) hintEl.textContent = '拖拽旋转 · 滚轮缩放 · 点击陨石查看 · 返回太阳系';
  showPanel(body.chain.name);
}

function exitFocus() {
  if (!focusBody) return;
  focusBody = null;
  distance = solarDistance || 15;
  selected = null;
  applyVisibility();
  if (focusBackEl) focusBackEl.classList.remove('show');
  if (hintEl) hintEl.textContent = '拖拽旋转 · 滚轮缩放 · 点击查看';
  panel.classList.remove('show');
  document.body.classList.remove('panel-open');
}

function selectBody(body) {
  selected = body || null;
  if (!body || !body.chain) {
    panel.classList.remove('show');
    document.body.classList.remove('panel-open');
    return;
  }
  const kids = body.chain.children || [];
  if (body.level === 1 && kids.length && focusBody !== body) {
    enterFocus(body);
  } else {
    showPanel(body.chain.name);
  }
}

if (focusBackEl) focusBackEl.addEventListener('click', exitFocus);
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (focusBody) exitFocus();
  else {
    panel.classList.remove('show');
    document.body.classList.remove('panel-open');
  }
});

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  moved = 0;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.style.cursor = 'grabbing';
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});

canvas.addEventListener('pointermove', (e) => {
  if (dragging) {
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx * 0.006;
    pitch = clamp(pitch - dy * 0.004, 0.06, 1.18);
    lastX = e.clientX;
    lastY = e.clientY;
    return;
  }
  const hit = pickAt(e.clientX, e.clientY);
  hovered = hit;
  canvas.style.cursor = hit ? 'pointer' : 'grab';
});

canvas.addEventListener('pointerup', (e) => {
  dragging = false;
  canvas.style.cursor = 'grab';
  if (moved < 5) {
    selectBody(pickAt(e.clientX, e.clientY));
  }
});

canvas.addEventListener('pointerleave', () => {
  if (!dragging) {
    hovered = null;
    canvas.style.cursor = 'grab';
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const lo = focusBody ? 2.4 : 6;
  const hi = focusBody ? 10 : 90;
  distance = clamp(distance * Math.exp(e.deltaY * 0.0012), lo, hi);
}, { passive: false });

/* ── 标签布局 ───────────────────────────── */
function updateLabels() {
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const narrow = W < 560;
  const inFocus = !!focusBody;
  const projected = [];
  const bodyRects = [];

  for (const b of bodies) {
    if (!b.mesh.visible) {
      b.labelEl.style.opacity = '0';
      b.labelEl.classList.remove('hot');
      continue;
    }
    const v = b.pos.clone().project(camera);
    if (v.z < -1 || v.z > 1) {
      b.labelEl.style.opacity = '0';
      b.labelEl.classList.remove('hot');
      continue;
    }
    const x = (v.x * .5 + .5) * W;
    const y = (-v.y * .5 + .5) * H;
    const camDist = camera.position.distanceTo(b.pos);
    const screenR = Math.max(2, (b.radius / (camDist * tanHalf)) * (H / 2));
    const hot = b === selected || b === hovered;

    if (b.level <= 1) {
      bodyRects.push({
        name: b.chain.name,
        x1: x - screenR - 5, x2: x + screenR + 5,
        y1: y - screenR - 5, y2: y + screenR + 5,
      });
    }

    let show = b.level <= 1
      || (b.level === 2 && (inFocus || (!narrow && (b.chain.nodes || 0) >= 5) || hot))
      || (b.level >= 3 && (inFocus || hot));

    if (show && b.level > 0) {
      labelPointer.set(v.x, v.y);
      labelRaycaster.setFromCamera(labelPointer, camera);
      labelRaycaster.far = camDist + b.radius * 3;
      const hits = labelRaycaster.intersectObjects(occluders, false);
      if (hits.length && hits[0].object !== b.mesh && hits[0].distance < camDist - b.radius * .8) {
        show = false;
      }
    }
    if (!show) {
      b.labelEl.style.opacity = '0';
      b.labelEl.classList.remove('hot');
      continue;
    }

    projected.push({
      body: b,
      x, y, screenR, camDist, hot,
      pri: hot ? 5 : (b.level === 0 ? 4 : (b.level === 1 ? 3 : 1)),
    });
  }

  projected.sort((a, b) => (b.pri - a.pri) || (a.camDist - b.camDist));

  const occupied = bodyRects.slice();
  for (const item of projected) {
    const el = item.body.labelEl;
    const w = Math.max(30, el.offsetWidth || (item.body.chain.name.length * 10 + 10));
    const h = item.body.level === 0 ? 17 : 14;
    const gap = 10;
    const candidates = [
      [item.x, item.y + item.screenR + gap + h / 2],
      [item.x, item.y - item.screenR - gap - h / 2],
      [item.x + item.screenR + w / 2 + gap, item.y],
      [item.x - item.screenR - w / 2 - gap, item.y],
      [item.x, item.y + item.screenR + gap + h * 2],
      [item.x, item.y - item.screenR - gap - h * 2],
    ];

    let placed = null;
    for (const [x, y] of candidates) {
      const r = {
        x1: x - w / 2 - 4, x2: x + w / 2 + 4,
        y1: y - h / 2 - 4, y2: y + h / 2 + 4,
      };
      if (r.x1 < 8 || r.x2 > W - 8 || r.y1 < 18 || r.y2 > H - 18) continue;
      if (occupied.some((o) => o.name !== item.body.chain.name && !(r.x2 < o.x1 || r.x1 > o.x2 || r.y2 < o.y1 || r.y1 > o.y2))) continue;
      placed = { x, y, r };
      break;
    }
    if (!placed && (item.hot || (!narrow && item.pri >= 3))) {
      const x = item.x;
      const y = item.y + item.screenR + gap + h / 2;
      placed = {
        x, y,
        r: { x1: x - w / 2 - 4, x2: x + w / 2 + 4, y1: y - h / 2 - 4, y2: y + h / 2 + 4 },
      };
    }
    if (!placed) {
      el.style.opacity = '0';
      el.classList.remove('hot');
      continue;
    }

    el.style.left = placed.x + 'px';
    el.style.top = placed.y + 'px';
    el.style.opacity = '1';
    el.classList.toggle('hot', item.hot);
    occupied.push(placed.r);
  }
}

/* ── 面板 ───────────────────────────────── */
async function showPanel(name) {
  panel.innerHTML = '<h3>加载中…</h3>';
  panel.classList.add('show');
  document.body.classList.add('panel-open');
  try {
    const r = await fetch('/api/chain?name=' + encodeURIComponent(name));
    const c = await r.json();
    const nodes = (c.nodes || []).slice(-12).reverse();
    const nodeCount = (c.nodes || []).length;
    const needHeader = nodeCount >= 5 && !c.header;
    const needRefresh = !!c.header && c.headerBy !== 'manual' && (nodeCount - (c.headerNodeCount || 0)) >= 5;
    panel.innerHTML = `
      <h3>${esc(c.name)} <span class="tag">${nodeCount} 个节点</span></h3>
      <div class="meta">父节点：${esc(c.parent || '—')} · 头部基于 ${c.headerNodeCount || 0} 个节点</div>
      ${needHeader ? '<div class="meta" style="color:#e0b070">⚠ 节点 ≥5，还没有链头</div>' : ''}
      ${needRefresh ? '<div class="meta" style="color:#c9a060">提示：链头之后又新增了 ≥5 个节点，可刷新</div>' : ''}
      ${c.header ? `<div class="head">${esc(c.header)}</div>` : '<div class="meta">（还没有头部概览）</div>'}
      ${nodes.length ? nodes.map((n) => `
        <div class="node">
          <span class="who">${esc(n.who || '·')}</span>
          ${esc(n.text)}
          ${n.superseded ? ' <span style="color:#c96">（已作废）</span>' : ''}
          <div style="color:#3f4d6e;font-size:10px">${esc(n.t || '')}</div>
        </div>`).join('') : '<div class="meta">（还没有节点）</div>'}
    `;
  } catch (e) {
    panel.innerHTML = '<h3>读取出错</h3><div class="meta">' + esc(e.message) + '</div>';
  }
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ── 渲染循环 ───────────────────────────── */
let lastT = 0;
function animate(now) {
  const t = now * .001;
  if (!dragging) yaw += .00075;
  updateCamera();

  const pulse = 1 + Math.sin(t * 1.5) * .022;
  if (rootBody) {
    rootBody.mesh.scale.setScalar(rootBody.radius * pulse);
    rootLight.intensity = 34 + Math.sin(t * 1.5) * 4;
  }

  for (const b of bodies) {
    if (!b.orbit) continue;
    const center = b.orbit.parent ? b.orbit.parent.pos : ORIGIN;
    b.pos.copy(orbitPoint(center, b.orbit.radius, b.orbit.tilt, b.orbit.phase + t * b.orbit.speed, b.orbit.roll, b.orbit.ecc || 0));
    b.mesh.position.copy(b.pos);
    if (b.glow) b.glow.position.copy(b.pos);
    if (b.indicator) b.indicator.position.copy(b.pos);
    if (b.debris) {
      b.debris.position.copy(b.pos);
      b.debris.rotation.y = t * b.debrisSpeed;
    }
    if (b.orbitLine && b.orbitLine.userData.parentBody) {
      b.orbitLine.position.copy(b.orbitLine.userData.parentBody.pos);
    }
  }

  for (const b of bodies) {
    const hot = b === selected || b === hovered;
    if (b.level > 0) {
      const s = b.radius * (hot ? 1.09 : 1);
      if (b.isRock) {
        b.mesh.scale.set(s * 1.15, s * .72, s * .95);
        if (b.spin) {
          b.mesh.rotation.x += b.spin.x;
          b.mesh.rotation.y += b.spin.y;
          b.mesh.rotation.z += b.spin.z;
        }
      } else {
        b.mesh.scale.setScalar(s);
      }
    }
    if (b.glow) b.glow.material.opacity = b.glowBase * (hot ? 1.25 : 1);
    if (b.indicator) b.indicator.material.opacity = (b.chain.needHeader ? .65 : .28) * (hot ? 1.4 : 1);
  }

  if (selected && focusBody !== selected) {
    selectionSprite.visible = true;
    selectionSprite.position.copy(selected.pos);
    selectionSprite.scale.setScalar(selected.radius * 5.4 * (1 + Math.sin(t * 2) * .04));
    selectionSprite.material.opacity = .72 + Math.sin(t * 2) * .16;
  } else {
    selectionSprite.visible = false;
  }

  starsNear.rotation.y = t * .0008;
  starsBright.rotation.y = t * .0005;

  updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

async function load() {
  try {
    const r = await fetch('/api/chains');
    data = await r.json();
    buildScene(data);
    updateCamera();
    requestAnimationFrame(animate);
    fetch('/api/stats', { cache: 'no-store' }).then((r) => r.json()).then((s) => {
      if (s && s.version) {
        const el = document.getElementById('ver');
        if (el) el.textContent = ' · v' + s.version;
      }
    }).catch(() => { /* 版本号读不到不影响链网 */ });
  } catch (e) {
    fail('读取链网失败：' + (e && e.message ? e.message : e));
  }
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const aspect = W / H;
  camera.aspect = aspect;
  camera.fov = aspect < 0.8 ? 52 : 34;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  const fit = fitDistance();
  if (!focusBody && distance < fit) distance = fit;
  if (focusBody) distance = clamp(distance, 2.4, 10);
  if (focusBackEl) focusBackEl.textContent = W < 560 ? '← 返回' : '← 返回太阳系';
}
window.addEventListener('resize', resize);

updateCamera();
load();
</script>
</body>
</html>
