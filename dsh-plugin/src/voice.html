<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鱼的声音 · 核星记忆</title>
<style>
  :root{
    --bg:#0b0f16; --card:#1b2230; --text:#e8eef8; --muted:#8f9bb0;
    --dim:#5d6a7f; --mint:#63e8d6; --blue:#9fb4ff; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--text);
    background:radial-gradient(1200px 600px at 20% 0%,#142033 0%,var(--bg) 60%);
    font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  }
  a{color:var(--blue);text-decoration:none}
  header{
    max-width:860px;margin:0 auto;padding:28px 24px 0;
    display:flex;align-items:center;justify-content:space-between;
    color:var(--muted);font-size:13px;
  }
  main{max-width:860px;margin:0 auto;padding:24px}
  .card{
    background:linear-gradient(180deg,rgba(30,38,52,.92),rgba(20,26,36,.96));
    border:1px solid var(--line);border-radius:22px;padding:30px 32px;
    box-shadow:0 30px 80px rgba(0,0,0,.35);
  }
  .kicker{color:var(--mint);letter-spacing:.22em;font-size:11px}
  h1{margin:8px 0 6px;font-size:30px;letter-spacing:.04em}
  .sub{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 22px}
  .row{
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:16px 0;border-top:1px solid var(--line);
  }
  .row:first-of-type{border-top:0}
  .label{font-size:14px;color:#dfe6f2}
  .hint{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.6}
  .switch{position:relative;width:52px;height:30px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;border-radius:999px;background:#2a3342;transition:.2s;cursor:pointer}
  .switch span:after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#8894a8;transition:.2s}
  .switch input:checked + span{background:rgba(99,232,214,.28)}
  .switch input:checked + span:after{transform:translateX(22px);background:var(--mint)}
  .voices{display:flex;gap:10px;flex-wrap:wrap}
  .voice{
    display:flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;color:#cfd8e6;font-size:13px;background:rgba(255,255,255,.02);
  }
  .voice:has(input:checked){border-color:rgba(99,232,214,.5);color:var(--mint);background:rgba(99,232,214,.08)}
  .voice input{accent-color:var(--mint)}
  .preview{margin-top:6px}
  textarea{
    width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);
    border-radius:12px;background:#0d131c;color:var(--text);padding:12px 14px;
    font:inherit;font-size:14px;line-height:1.7;
  }
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:13px;cursor:pointer}
  .primary{background:linear-gradient(180deg,#7ef0e2,#44d9c8);color:#071310;font-weight:700}
  .ghost{background:rgba(255,255,255,.05);color:#dfe6f2;border:1px solid var(--line)}
  button:disabled{opacity:.45;cursor:default}
  audio{width:100%;margin-top:14px}
  audio[hidden]{display:none}
  .status{min-height:22px;margin-top:10px;color:var(--muted);font-size:13px;line-height:1.6}
  .warn{color:#f2d06b}
  .notice{
    border:1px solid rgba(242,208,107,.25);background:rgba(242,208,107,.07);
    color:#f2d06b;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;margin:14px 0;
  }
  .notice[hidden]{display:none}
  .foot{max-width:860px;margin:18px auto 0;padding:0 24px 28px;color:var(--dim);font-size:12px;line-height:1.7}
  @media (max-width:560px){
    .card{padding:22px 18px} h1{font-size:25px}
    .row{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>
<header>
  <a href="/">← 总览</a>
  <span>HEXING MEMORY / VOICE</span>
</header>

<main>
  <section class="card">
    <div class="kicker">V O I C E</div>
    <h1>鱼的声音</h1>
    <p class="sub">DeepSeek TTS · 本机播放。开启后可以试听，也可以让鱼读今天的心路历程。</p>

    <div id="notice" class="notice" hidden></div>

    <div class="row">
      <div>
        <div class="label">语音合成</div>
        <div class="hint">关闭时不调用 API，也不产生费用</div>
      </div>
      <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
    </div>

    <div class="row">
      <div>
        <div class="label">音色</div>
        <div class="hint">stella 女声 · tide 男声</div>
      </div>
      <div class="voices">
        <label class="voice"><input type="radio" name="voice" value="stella">stella · 女声</label>
        <label class="voice"><input type="radio" name="voice" value="tide">tide · 男声</label>
      </div>
    </div>

    <div class="row" style="display:block">
      <div class="label">试听</div>
      <div class="preview">
        <textarea id="previewText">我在。今天也辛苦了，先听会儿歌吧。</textarea>
        <div class="actions"><button class="primary" id="previewBtn">试听</button></div>
      </div>
    </div>

    <div class="row">
      <div>
        <div class="label">读今天的心路历程</div>
        <div class="hint" id="diaryHint">用鱼的声音读今天写下的那几句</div>
      </div>
      <button class="ghost" id="diaryBtn">读今天</button>
    </div>

    <audio id="player" controls hidden></audio>
    <div id="status" class="status"></div>
  </section>
</main>

<div class="foot">语音由 DeepSeek TTS 生成；文本只发给你配置的 API，不写进记忆。</div>

<script>
  const $ = (id) => document.getElementById(id);
  let state = { enabled: false, voice_id: 'stella', configured: false, diaryToday: 0 };
  let audioUrl = '';

  function setStatus(text, warn) {
    const el = $('status');
    el.textContent = text || '';
    el.className = 'status' + (warn ? ' warn' : '');
  }

  function apply() {
    $('enabled').checked = !!state.enabled;
    document.querySelectorAll('input[name=voice]').forEach((r) => {
      r.checked = r.value === (state.voice_id || 'stella');
    });
    const notice = $('notice');
    if (!state.configured) {
      notice.hidden = false;
      notice.textContent = '还没配置 DEEPSEEK_API_KEY。在启动 DSH 的环境里设一次，或把 key 放到本机数据目录的 voice-key.txt，然后重启 DSH。';
    } else {
      notice.hidden = true;
    }
    $('previewBtn').disabled = !state.enabled || !state.configured;
    $('diaryBtn').disabled = !state.enabled || !state.configured;
    $('diaryHint').textContent = state.diaryToday
      ? '今天写了 ' + state.diaryToday + ' 条'
      : '今天还没写心路历程';
  }

  async function load() {
    try {
      const r = await fetch('/api/voice');
      const j = await r.json();
      if (j && j.ok) state = j;
    } catch (e) { /* ignore */ }
    apply();
  }

  async function save() {
    const picked = document.querySelector('input[name=voice]:checked');
    const body = {
      enabled: $('enabled').checked,
      voice_id: (picked && picked.value) || state.voice_id,
    };
    try {
      const r = await fetch('/api/voice', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (j && j.ok) { state = Object.assign(state, j); setStatus('已保存', false); }
      else setStatus((j && j.error) || '保存失败', true);
    } catch (e) {
      setStatus('保存失败：' + e, true);
    }
    apply();
  }

  async function play(blob) {
    const player = $('player');
    if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = ''; }
    audioUrl = URL.createObjectURL(blob);
    player.src = audioUrl;
    player.hidden = false;
    try { await player.play(); } catch (e) { /* 浏览器拦自动播放时，用户点播放 */ }
  }

  async function fetchAudio(path, body) {
    setStatus('正在合成…', false);
    try {
      const r = await fetch(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const ct = r.headers.get('content-type') || '';
      if (!r.ok || !ct.includes('audio')) {
        let msg = '合成失败';
        try { const j = await r.json(); msg = (j && j.error) || msg; } catch (e) { /* ignore */ }
        setStatus(msg, true); return;
      }
      await play(await r.blob());
      setStatus('', false);
    } catch (e) {
      setStatus('合成失败：' + e, true);
    }
  }

  $('enabled').onchange = save;
  document.querySelectorAll('input[name=voice]').forEach((r) => { r.onchange = save; });
  $('previewBtn').onclick = () => {
    const text = $('previewText').value.trim();
    if (!text) { setStatus('先写一句试听文本', true); return; }
    fetchAudio('/api/voice/preview', { text, voice_id: state.voice_id });
  };
  $('diaryBtn').onclick = () => fetchAudio('/api/voice/diary', {});
  load();
</script>
</body>
</html>
